[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Deterministic trajectory evaluation for tool-using agents: golden traces, budgets, pass@k, and a CI gate."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-eval = "agent_eval.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
